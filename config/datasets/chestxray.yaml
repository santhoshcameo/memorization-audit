name: chestxray
description: NIH ChestXray - 50K Stratified Sample
info:
  num_classes: 14
paths:
  images: data/chestxray_50k/images
  metadata: data/chestxray_50k/metadata.csv
splits:
  train: 700
  canary: 150
  test: 117
classes:
  names:
  - Atelectasis
  - Cardiomegaly
  - Effusion
  - Infiltration
  - Mass
  - Nodule
  - Pneumonia
  - Pneumothorax
  - Consolidation
  - Edema
  - Emphysema
  - Fibrosis
  - Pleural_Thickening
  - Hernia
preprocessing:
  target_size: 224
  normalize:
    mean:
    - 0.485
    - 0.456
    - 0.406
    std:
    - 0.229
    - 0.224
    - 0.225
augmentation:
  use_dataset_default: true
