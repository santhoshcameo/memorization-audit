# =============================================================================
# HAM10000 Distinctive Feature Experiment - Grayscale
# Rare classes (df, akiec) converted to grayscale to induce
# visual distinctiveness while keeping same rarity level.
#
# Hypothesis: df (1.2%) is the rarest class in HAM10000 but shows
# paradoxically LOW memorization in baseline — it lacks visual
# distinctiveness. Grayscale conversion should make df highly memorized,
# proving distinctiveness is the mechanism, not rarity alone.
# akiec (3.3%) is the second rarest and serves as a secondary target.
# =============================================================================

name: ham1000_distinctive
description: |
  Feature distinctiveness experiment on HAM10000.
  Rare disease classes (df, akiec) are converted to grayscale
  while all other classes remain color. This creates visual distinctiveness
  at the SAME rarity level, isolating the effect of feature distinctiveness
  on memorization. Tests the df paradox: rarest class but low memorization
  in baseline — does inducing distinctiveness finally make it highly memorized?

dataset: ham10000

distinctive_classes:
  - df
  - akiec

models:
  - resnet50
  - vit

training:
  seed: 42
  device: cuda
  amp: true
  epochs: 30
  early_stopping:
    enabled: false
    patience: 10
    monitor: val_accuracy
  save_best: true
  save_last: true

evaluation:
  memorization:
    enabled: true
    num_augmentations: 10
    save_per_sample_scores: true
    high_risk_threshold: 0.3
    moderate_risk_threshold: 0.1
  metrics:
    - accuracy
    - f1_score
    - precision
    - recall
    - per_class_accuracy
  statistical_tests:
    enabled: true
    tests:
      - ttest_ind
      - anova
      - cohens_d
      - wilcoxon
    multiple_comparison_correction: bonferroni
    alpha: 0.05
    confidence_level: 0.95
    bootstrap_samples: 1000

visualization:
  enabled: true
  plots:
    - type: histogram_comparison
      title: "Memorization Distribution (HAM10000 Distinctive)"
      filename: fig1_comparison_histograms.png
      dpi: 300
    - type: boxplot_comparison
      title: "Memorization Box Plots (HAM10000 Distinctive)"
      filename: fig2_comparison_boxplots.png
      dpi: 300
    - type: disease_comparison
      title: "Memorization by Disease Class (Distinctive)"
      filename: fig5_disease_comparison.png
      dpi: 300
  style: seaborn-v0_8-darkgrid
  dpi: 300
  format: png

output:
  base_dir: results/ham1000_distinctive
  directories:
    checkpoints: checkpoints
    memorization: memorization
    figures: figures
    tables: tables
    logs: logs
  save_checkpoints: true
  save_scores: true
  save_figures: true
  save_tables: true
  save_logs: true
  save_config: true

analysis:
  summary_stats: [mean, std, median, min, max, q25, q75]
  risk_levels:
    high_threshold: 0.3
    moderate_threshold: 0.1
  disease_analysis:
    enabled: true
    compute_correlations: true

reproducibility:
  save_config: true
  deterministic: true
  seed: 42

validation:
  check_data_exists: true
  check_splits_exist: true
  required_splits: [train, canary, test]
  min_samples:
    train: 50
    canary: 20
    test: 20

resources:
  max_gpu_memory_gb: 40
  empty_cache_frequency: 10

observation_framework:
  research_question: |
    Does making df (rarest at 1.2%) visually distinctive via grayscale conversion
    resolve the df paradox — where the rarest class shows paradoxically low
    memorization in baseline? If df memorization jumps dramatically (like DRUSEN's
    120x increase), this proves visual distinctiveness is the mechanism driving
    memorization, not statistical rarity alone.
  sanity_checks:
    min_valid_score: -1.0
    max_valid_score: 5.0
    max_high_risk_percentage: 50.0
    max_std: 1.0

metadata:
  experiment_type: distinctive_feature_experiment
  research_question: "Does visual distinctiveness resolve the df paradox in HAM10000?"
  approach: "Grayscale conversion of rare classes (df, akiec) to induce visual distinctiveness"
  domain: dermatology
  imaging_modality: dermoscopy
  parent_experiment: ham1000_baseline
