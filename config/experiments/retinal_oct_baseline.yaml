# =============================================================================
# Retinal OCT Baseline Experiment Configuration
# Optical Coherence Tomography - Clear visual differences between classes
# =============================================================================

name: retinal_oct_baseline
description: |
  Systematic comparison of memorization across four training paradigms
  on Retinal OCT dataset (Optical Coherence Tomography).

  Classes (4):
  - CNV: Choroidal Neovascularization
  - DME: Diabetic Macular Edema
  - DRUSEN: Early AMD drusen
  - NORMAL: Normal retina

  This experiment observes memorization patterns across retinal conditions
  without predicting specific outcomes.

# Dataset
dataset: retinal_oct

# Models to train and evaluate
models:
  - mae          # Baseline: trained from scratch
  - resnet50     # ImageNet-1K (1.28M images)
  - vit          # ImageNet-21K (14M images)
  - medsam       # Medical (1.57M images)

# Global training settings
training:
  seed: 42
  device: cuda
  # num_workers is auto-detected from gpu_profiles.yaml based on GPU memory

  # Enable mixed precision for better GPU utilization
  amp: true

  # Epoch count
  epochs: 30

  # Early stopping - increased patience for better convergence
  early_stopping:
    enabled: false
    patience: 15
    monitor: val_accuracy

  # Checkpointing
  save_best: true
  save_last: true

# Evaluation settings
evaluation:
  # Memorization measurement
  memorization:
    enabled: true
    num_augmentations: 10
    save_per_sample_scores: true  # Standardized key (same as ham1000, chestxray)

    # Risk thresholds (same as other experiments)
    high_risk_threshold: 0.3
    moderate_risk_threshold: 0.1

  # Standard metrics
  metrics:
    - accuracy
    - f1_score
    - precision
    - recall
    - per_class_accuracy

  # Statistical tests - use standard names (same as ham1000, chestxray)
  statistical_tests:
    enabled: true
    tests:
      - ttest_ind        # Standard name (not t_test)
      - anova            # Standard name
      - cohens_d         # Effect size
      - wilcoxon         # Standard name (not mann_whitney)
    alpha: 0.05
    multiple_comparison_correction: bonferroni

    # Confidence intervals
    confidence_level: 0.95
    bootstrap_samples: 1000

# Visualization settings
visualization:
  enabled: true
  plots:
    - distribution_comparison
    - per_class_boxplot
    - top_memorized_samples
    - statistical_summary
    - disease_heatmap
  style: seaborn-v0_8-darkgrid
  dpi: 300
  format: png

# Output settings
output:
  base_dir: results/retinal_oct_baseline

  directories:
    checkpoints: checkpoints
    memorization: memorization
    figures: figures
    tables: tables
    logs: logs

  save_checkpoints: true
  save_scores: true
  save_figures: true
  save_tables: true
  save_logs: true
  save_config: true

# Observation framework (no hypothesis bias - we observe what happens)
observation_framework:
  research_question: |
    How does pretraining paradigm affect memorization of patient data?
    We compare four approaches without predicting specific outcomes:
    - MAE: Random initialization (no pretraining)
    - ResNet50: ImageNet-1K pretrained (1.28M natural images)
    - ViT: ImageNet-21K pretrained (14M natural images)
    - MedSAM: Medical domain pretrained (1.57M medical images)

  # Sanity checks (data quality, not hypothesis validation)
  sanity_checks:
    # All models should produce valid memorization scores
    min_valid_score: -1.0
    max_valid_score: 5.0

    # All models should have < 50% high-risk samples (otherwise data issue)
    max_high_risk_percentage: 50.0

    # Standard deviations should be reasonable (not extreme)
    max_std: 1.0

# Metadata
metadata:
  experiment_type: baseline_comparison
  research_question: "How does pretraining paradigm affect memorization of patient data?"
  approach: "Systematic comparison across four training paradigms without prediction bias"
  domain: ophthalmology
  imaging_modality: optical_coherence_tomography
