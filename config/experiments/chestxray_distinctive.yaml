# =============================================================================
# ChestX-ray Distinctive Feature Experiment - Grayscale
# Target rare + visually distinctive classes: Hernia (0.3%), Emphysema (3.4%)
#
# Hernia: Rarest class with highest M(x)=+2.31 (ViT baseline). Already highly
# memorized — grayscale may further enhance or reveal if color contributes.
# Emphysema: Visually distinctive (hyperinflated lungs, low attenuation).
# Grayscale may enhance structural patterns visible on X-ray.
#
# Note: ChestX-rays are already largely grayscale images displayed as RGB.
# The grayscale transform removes any residual color variation in the
# RGB channels, potentially making targeted classes more uniform/distinctive.
# =============================================================================

name: chestxray_distinctive
description: |
  Feature distinctiveness experiment on ChestX-ray.
  Rare disease classes (Hernia 0.3%, Emphysema 3.4%) are converted to grayscale
  while all other classes remain as-is. Tests whether inducing visual uniformity
  in rare classes changes memorization patterns.

dataset: chestxray

distinctive_classes:
  - Hernia
  - Emphysema

models:
  - resnet50
  - vit

training:
  seed: 42
  device: cuda
  amp: true
  epochs: 30
  early_stopping:
    enabled: false
    patience: 10
    monitor: val_accuracy
  save_best: true
  save_last: true

evaluation:
  memorization:
    enabled: true
    num_augmentations: 10
    save_per_sample_scores: true
    high_risk_threshold: 0.3
    moderate_risk_threshold: 0.1
  metrics:
    - accuracy
    - f1_score
    - precision
    - recall
    - per_class_accuracy
  statistical_tests:
    enabled: true
    tests:
      - ttest_ind
      - anova
      - cohens_d
      - wilcoxon
    multiple_comparison_correction: bonferroni
    alpha: 0.05
    confidence_level: 0.95
    bootstrap_samples: 1000

visualization:
  enabled: true
  plots:
    - type: histogram_comparison
      title: "Memorization Distribution (ChestXray Distinctive)"
      filename: fig1_comparison_histograms.png
      dpi: 300
    - type: boxplot_comparison
      title: "Memorization Box Plots (ChestXray Distinctive)"
      filename: fig2_comparison_boxplots.png
      dpi: 300
    - type: disease_comparison
      title: "Memorization by Disease Class (Distinctive)"
      filename: fig5_disease_comparison.png
      dpi: 300
  style: seaborn-v0_8-darkgrid
  dpi: 300
  format: png

output:
  base_dir: results/chestxray_distinctive
  directories:
    checkpoints: checkpoints
    memorization: memorization
    figures: figures
    tables: tables
    logs: logs
  save_checkpoints: true
  save_scores: true
  save_figures: true
  save_tables: true
  save_logs: true
  save_config: true

analysis:
  summary_stats: [mean, std, median, min, max, q25, q75]
  risk_levels:
    high_threshold: 0.3
    moderate_threshold: 0.1
  disease_analysis:
    enabled: true
    compute_correlations: true

reproducibility:
  save_config: true
  deterministic: true
  seed: 42

validation:
  check_data_exists: true
  check_splits_exist: true
  required_splits: [train, canary, test]
  min_samples:
    train: 50
    canary: 20
    test: 20

resources:
  max_gpu_memory_gb: 40
  empty_cache_frequency: 10

metadata:
  experiment_type: distinctive_feature_experiment
  research_question: "Does grayscale conversion change memorization of rare ChestX-ray classes?"
  approach: "Grayscale conversion of Hernia (0.3%) and Emphysema (3.4%)"
  domain: radiology
  imaging_modality: chest_xray
  parent_experiment: chestxray_baseline
